name: GetACourt independent accessibility contracts

on:
  push:
    branches: [cto/getacourt-a11y-source-20261021]
    paths:
      - "getacourt/**"
      - ".github/workflows/getacourt-a11y-ci.yml"
  pull_request:
    branches: [getacourt-staging]
    paths:
      - "getacourt/**"
      - ".github/workflows/getacourt-a11y-ci.yml"

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and accessible interaction contracts
        run: |
          node --check getacourt/assets/app.js
          node --test getacourt/tests/accessibility-contract.test.mjs
      - name: Install pinned browser runner (ephemeral CI only)
        run: |
          npm install --prefix "$RUNNER_TEMP/gac-a11y-tools" --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1 axe-core@4.14.0
          node "$RUNNER_TEMP/gac-a11y-tools/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Offline Chromium + WCAG 2.2 A/AA audit (320, 390, 768, 1440)
        env:
          GAC_A11Y_TOOLS: ${{ runner.temp }}/gac-a11y-tools/node_modules
        run: node getacourt/tests/browser-accessibility.mjs
      - name: Diff whitespace check
        run: git diff --check
