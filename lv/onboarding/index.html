<!DOCTYPE html>
<html lang="lv-LV"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="/assets/favicon.svg" rel="icon"/><link href="/assets/styles-v3.css" rel="stylesheet"/><title>FillMyCourt onboarding — sākt Revenue Leak Audit</title><meta content="Drošs onboarding klubiem: darbība, booking, dati un pilota mērķi." name="description"/><link href="https://fillmycourt.com/lv/onboarding/" rel="canonical"/><link href="https://fillmycourt.com/onboarding/" hreflang="pt-PT" rel="alternate"/><link href="https://fillmycourt.com/en/onboarding/" hreflang="en" rel="alternate"/><link href="https://fillmycourt.com/es/onboarding/" hreflang="es-ES" rel="alternate"/><link href="https://fillmycourt.com/lv/onboarding/" hreflang="lv-LV" rel="alternate"/><link href="https://fillmycourt.com/en/onboarding/" hreflang="x-default" rel="alternate"/><meta content="noindex,nofollow" name="robots"/></head><body><nav class="nav"><div class="container nav-inner"><a class="brand" href="/lv/" aria-label="FillMyCourt home"><img alt="FillMyCourt" class="brand-logo" src="/assets/logo.svg"/></a><div class="nav-links"><details class="lang-switcher"><summary aria-label="Language">LV</summary><div class="lang-menu"><a href="/onboarding/" hreflang="pt-PT">PT</a><a href="/en/onboarding/" hreflang="en">EN</a><a href="/es/onboarding/" hreflang="es-ES">ES</a><a class="active" href="/lv/onboarding/" hreflang="lv-LV">LV</a></div></details><a href="/lv/#engine">Pieprasījuma dzinējs</a><a href="/lv/#crm">CRM</a><a href="/lv/#distribution">Izplatīšana</a><a href="/lv/demo/">Demo</a><a class="btn btn-primary" data-event="cta_contact" href="/lv/#contact">Analizēt klubu</a></div></div></nav><main><section class="hero"><div class="container"><div class="eyebrow">Onboarding</div><h1>Sagatavot Revenue Leak Audit.</h1><p>Sāc ar minimizētiem un autorizētiem datiem. Nesūti paroles, karšu datus, identitātes dokumentus vai privātas ziņas.</p></div></section><section class="section white"><div class="container"><form action="/lv/onboarding/thanks.html" class="onboard-form" data-netlify="true" data-onboarding-form="" enctype="multipart/form-data" method="POST" name="fillmycourt-onboarding"><input name="form-name" type="hidden" value="fillmycourt-onboarding"/><input name="language" type="hidden" value="lv"/><div class="honeypot"><label>Do not fill<input name="website"/></label></div><div class="form-section"><h2>1. Klubs un kontakts</h2><div class="form-grid"><div class="form-field"><label>Klubs</label><input name="club" required=""/></div><div class="form-field"><label>Website</label><input name="club_website" type="url"/></div><div class="form-field"><label>Vārds</label><input name="contact_name" required=""/></div><div class="form-field"><label>Amats</label><input name="role" required=""/></div><div class="form-field"><label>Email</label><input name="email" required="" type="email"/></div><div class="form-field"><label>Tālrunis / WhatsApp</label><input name="phone"/></div><div class="form-field"><label>Pilsēta / valsts</label><input name="location" required=""/></div><div class="form-field"><label>Kortu skaits</label><input max="200" min="1" name="courts" required="" type="number"/></div></div></div><div class="form-section"><h2>2. Esošā darbība</h2><div class="form-grid"><div class="form-field"><label>Galvenais sporta veids</label><select name="sport" required=""><option>Padel</option><option>Tennis</option><option>Squash</option><option>Pickleball</option><option>Multi-racket</option></select></div><div class="form-field"><label>Rezervāciju sistēma</label><input name="booking_system" required=""/></div><div class="form-field"><label>Rezervācijas/mēn.</label><input min="0" name="bookings_month" type="number"/></div><div class="form-field"><label>Vidējais noslogojums</label><input name="occupancy"/></div><div class="form-field"><label>Booking mērķis</label><select name="booking_goal"><option>Saglabāt esošo sistēmu</option><option>Izvērtēt FillMyCourt native booking</option><option>White-label app + tiešais booking</option><option>Cross-club tīkls / jauns pieprasījums</option></select></div><div class="form-field full"><label>Kur ir lielākais zaudējums?</label><textarea name="problem_detail" required=""></textarea></div></div></div><div class="form-section"><h2>3. Data</h2><div class="form-grid"><div class="form-field"><label>Vēlamā metode</label><select name="data_method"><option>Droša saite vēlāk</option><option>API / export</option><option>Vēl nezinu</option></select></div><div class="form-field"><label>Pieejamais periods</label><select name="data_period"><option>4 weeks</option><option>8 weeks</option><option selected="">12 weeks</option><option>6+ months</option></select></div></div></div><div class="form-section"><h2>4. Pilota mērķis</h2><div class="form-grid"><div class="form-field full"><label>Kāds rezultāts padarītu pilotu vērtīgu?</label><textarea name="success_definition" required=""></textarea></div><div class="form-field"><label>Vēlamais sākuma datums</label><input name="preferred_start" type="date"/></div><div class="form-field"><label>Kas apstiprina</label><input name="decision_maker"/></div></div></div><div class="form-section"><label class="checkbox-row"><input name="authority" required="" type="checkbox"/><span>Apstiprinu, ka man ir tiesības kopīgot šos datus.</span></label><label class="checkbox-row"><input name="contact_ok" required="" type="checkbox"/><span>Piekrītu saziņai par šo Audit/pilotu.</span></label><label class="checkbox-row"><input name="scope_ack" required="" type="checkbox"/><span>Saprotu, ka forma sagatavo piedāvājumu un automātiski nerada pirkumu.</span></label></div><button class="btn btn-primary" type="submit">Nosūtīt onboarding</button></form></div></section></main><script defer="" src="/assets/app-v4.js"></script></body></html>
