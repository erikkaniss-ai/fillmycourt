name: Import and brand FillMyCourt source

'on':
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-source.yml"
      - "source/fillmycourt-v3.3.4.zip"

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[skip import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack canonical source
        run: |
          set -euo pipefail
          rm -rf /tmp/fmc-import
          mkdir -p /tmp/fmc-import
          unzip -q source/fillmycourt-v3.3.4.zip -d /tmp/fmc-import
          rm -rf /tmp/fmc-import/archive
          find . -mindepth 1 -maxdepth 1             ! -name .git ! -name .github ! -name source ! -name README.md             -exec rm -rf {} +
          cp -a /tmp/fmc-import/. .
          printf '.DS_Store\nThumbs.db\n*.tmp\n' > .gitignore

      - name: Apply v3.4 blue identity
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageDraw, ImageFont

          root=Path(".")
          logo='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 118" role="img" aria-labelledby="t d">
          <title id="t">FillMyCourt</title><desc id="d">Revenue infrastructure for racket clubs</desc>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B4FBF"/><stop offset="1" stop-color="#35A7FF"/></linearGradient></defs>
          <g transform="translate(5,8)">
           <path d="M10 42 38 16h45L57 42Z" fill="#0B4FBF"/><path d="M62 42 90 16h44l-24 26Z" fill="#35A7FF" opacity=".92"/>
           <path d="M2 48h52L31 79H0Z" fill="#0A315F"/><path d="M57 48h51L84 79H34Z" fill="#1267E5"/>
           <path d="M112 48h47l-11 31H91Z" fill="#168BFF"/><path d="M138 16h35l-10 26h-49Z" fill="#1B91FF"/>
           <path d="M27 77C78 74 109 61 142 27" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
           <path d="M53 79C95 74 124 58 151 34" fill="none" stroke="#35A7FF" stroke-width="3.4" stroke-linecap="round" opacity=".9"/>
           <circle cx="161" cy="13" r="9.5" fill="#168BFF"/>
          </g>
          <g font-family="Inter,Arial,sans-serif" font-weight="800" font-size="52" letter-spacing="-2.2">
           <text x="192" y="68" fill="#071E33">Fill</text><text x="278" y="68" fill="#1267E5">My</text><text x="346" y="68" fill="#071E33">Court</text>
          </g>
          <text x="195" y="94" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="5.8" fill="#5E748E">MORE PLAY · HIGHER REVENUE</text>
          </svg>'''
          favicon='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#071E33"/><g transform="translate(8 8)"><path d="M1 22 13 10h15L17 22Z" fill="#0B4FBF"/><path d="M19 22 31 10h15L36 22Z" fill="#35A7FF"/><path d="M0 26h17L8 39H0Z" fill="#0A315F"/><path d="M18 26h18L26 39H10Z" fill="#1267E5"/><path d="M37 26h12l-4 13H29Z" fill="#168BFF"/><path d="M10 39C27 37 37 31 48 18" fill="none" stroke="#35A7FF" stroke-width="3.6" stroke-linecap="round"/><circle cx="50" cy="12" r="4" fill="#168BFF"/></g></svg>'''
          (root/"assets/logo.svg").write_text(logo,encoding="utf-8")
          (root/"assets/favicon.svg").write_text(favicon,encoding="utf-8")

          replacements={
            "#2563eb":"#1267E5","#0f4fd6":"#0B4FBF","#16a34a":"#1267E5",
            "#21a66b":"#1267E5","#6ee7a1":"#68C0FF","#c7ff4b":"#35A7FF",
            "#79c997":"#69B8FF","#71c78f":"#69B8FF","#56bd79":"#35A7FF",
            "#e7f7ed":"#EAF4FF","#e6f6ec":"#EAF4FF","#18783d":"#0B4FBF",
            "#147a38":"#0B4FBF","#0f1d30":"#0A2847","#0a1628":"#071E33",
            "#07111e":"#06172B","#0b1423":"#071E33","#1d3553":"#0A315F",
            "#eaf8ef":"#EAF4FF","#e9f6ee":"#EAF4FF"
          }

          brand_pat=re.compile(r'<a class="brand" href="([^"]*)"><span class="brand-mark">F</span><(?:span|strong)>FillMyCourt</(?:span|strong)></a>')
          logo_pat=re.compile(r'<a class="logo" href="([^"]*)"><img[^>]*class="logo-mark"[^>]*/><span>FillMyCourt</span></a>')
          for p in root.rglob("*.html"):
            if "archive" in p.parts: continue
            s=p.read_text(encoding="utf-8",errors="ignore")
            s=brand_pat.sub(lambda m:f'<a class="brand" href="{m.group(1)}" aria-label="FillMyCourt home"><img alt="FillMyCourt" class="brand-logo" src="/assets/logo.svg"/></a>',s)
            s=logo_pat.sub(lambda m:f'<a class="logo" href="{m.group(1)}" aria-label="FillMyCourt home"><img alt="FillMyCourt" class="brand-logo" src="/assets/logo.svg"/></a>',s)
            for a,b in replacements.items(): s=s.replace(a,b)
            p.write_text(s,encoding="utf-8")

          override='''

          /* v3.4 blue identity */
          :root{--ink:#071E33;--ink2:#0A315F;--blue:#1267E5;--blue2:#0B4FBF;--green:#1267E5;--sky:#EAF4FF;--mint:#EAF4FF;--brand-electric:#35A7FF}
          body{background:linear-gradient(180deg,#F8FBFF 0,#F4F8FD 48%,#F8FBFF 100%)}
          .nav{background:rgba(248,251,255,.94);border-bottom:1px solid rgba(18,103,229,.11);box-shadow:0 8px 30px rgba(7,30,51,.035)}
          .brand,.logo{min-width:0}.brand-logo{display:block;width:238px;height:auto;max-width:36vw}.logo .brand-logo{width:220px}
          .btn-primary,.btn-lime{background:linear-gradient(135deg,#0B4FBF,#168BFF)!important;color:#fff!important;border-color:transparent!important;box-shadow:0 10px 28px rgba(18,103,229,.22)}
          .btn-primary:hover,.btn-lime:hover{background:linear-gradient(135deg,#083F99,#1267E5)!important;box-shadow:0 14px 34px rgba(18,103,229,.28)}
          .hero{background:radial-gradient(circle at 84% 9%,rgba(53,167,255,.22) 0,transparent 27%),radial-gradient(circle at 70% 30%,rgba(18,103,229,.11),transparent 29%),linear-gradient(180deg,#FAFCFF 0,#F4F8FD 100%)}
          .product-shell,.control-room,.calc-result,.sim-waterfall,.report-callout,.pnl,.booking-core,.tree,.section.dark,.section-dark,.lead-section,.lead-section-v3,.demo-v2{background:linear-gradient(145deg,#071E33,#0A315F)!important}
          .product-shell{box-shadow:0 34px 90px rgba(7,30,51,.22)}
          .progress>span,.sim-bars .sbar.rec,.sim-bars .sbar.net,.waterfall .bar.rec,.waterfall .bar.net,.demo-bar i b,.demo-progress b{background:linear-gradient(90deg,#1267E5,#35A7FF)!important}
          .amount,.calc-result .annual,.pnl-row.total strong,.report-callout .big,.sim-results .profit strong,.demo-owner-kpis .profit strong,.demo-big-money strong,.pnl-line strong.green{color:#35A7FF!important}
          .kpi.good strong,.seg.green,.slot.open,.price-tag{color:#1267E5!important}.seg.green,.slot.open{background:#EAF4FF!important}
          .eyebrow:before{background:#35A7FF!important;box-shadow:0 0 0 5px rgba(53,167,255,.13)!important}
          .section-dark .section-kicker,.section.dark .kicker,.how-card .step,.auto-step span,.demo-story-nav button b{color:#69B8FF!important}
          .offer-featured{border-color:#1267E5!important}.offer-tag{background:#EAF4FF!important;color:#0B4FBF!important;border:1px solid #BBD8F5}
          .brand-rule{border-left-color:#1267E5!important;background:linear-gradient(90deg,#EDF6FF,#F9FCFF)!important}
          .app-hero,.project-one .app-hero{background:linear-gradient(135deg,#0A315F,#1267E5)!important}
          .club-dot{background:#1267E5!important}.working-badge,.slot-pill{background:#EAF4FF!important;color:#0B4FBF!important}
          .slot-pill.hot{background:#DFF1FF!important;color:#0A5EA8!important}
          .venue-thumb{background:linear-gradient(135deg,#D9ECFF,#7FBAF1)!important}
          .footer,.footer-v3{background:#051526!important}
          .footer strong,.footer-v3 strong{color:#fff}
          .lang-switcher[open] summary{border-color:#7fb8ed;box-shadow:0 0 0 2px rgba(18,103,229,.09)}
          .nav-links .lang-menu a:hover,.nav-links .lang-menu a.active{background:#EAF4FF;color:#1267E5}
          @media(max-width:900px){.brand-logo{width:196px;max-width:46vw}}
          @media(max-width:620px){.brand-logo{width:166px;max-width:52vw}.nav-inner{height:66px}}
          '''
          for cssname in ("assets/styles-v3.css","assets/styles.css"):
            p=root/cssname
            if p.exists():
              s=p.read_text(encoding="utf-8",errors="ignore")
              for a,b in replacements.items(): s=s.replace(a,b)
              if "/* v3.4 blue identity */" not in s: s+=override
              p.write_text(s,encoding="utf-8")

          # Blue Open Graph card
          W,H=1200,630
          im=Image.new("RGB",(W,H),"#06172B"); d=ImageDraw.Draw(im)
          for y in range(H):
              t=y/(H-1); r=int(6+(18-6)*t); g=int(23+(72-23)*t); b=int(43+(135-43)*t)
              d.line([(0,y),(W,y)],fill=(r,g,b))
          d.ellipse((790,-180,1370,400),fill="#0C58B8")
          d.polygon([(0,500),(520,500),(680,630),(0,630)],fill="#071E33")
          # mark
          ox,oy=80,92
          d.polygon([(ox,oy+65),(ox+55,oy+15),(ox+140,oy+15),(ox+90,oy+65)],fill="#0B4FBF")
          d.polygon([(ox+100,oy+65),(ox+155,oy+15),(ox+238,oy+15),(ox+193,oy+65)],fill="#35A7FF")
          d.polygon([(ox,oy+78),(ox+92,oy+78),(ox+50,oy+142),(ox,oy+142)],fill="#0A315F")
          d.polygon([(ox+100,oy+78),(ox+192,oy+78),(ox+145,oy+142),(ox+58,oy+142)],fill="#1267E5")
          d.ellipse((ox+245,oy-8,ox+279,oy+26),fill="#168BFF")
          try:
              bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              reg="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              f1=ImageFont.truetype(bold,76); f2=ImageFont.truetype(bold,42); f3=ImageFont.truetype(reg,24)
          except:
              f1=f2=f3=None
          d.text((80,285),"Fill",font=f1,fill="white")
          x=228; d.text((x,285),"My",font=f1,fill="#35A7FF"); d.text((x+115,285),"Court",font=f1,fill="white")
          d.text((82,390),"Revenue infrastructure",font=f2,fill="white")
          d.text((82,445),"for racket clubs",font=f2,fill="#35A7FF")
          d.text((82,535),"CRM  ·  BOOKING  ·  RETENTION  ·  LOYALTY  ·  GROWTH",font=f3,fill="#B8D9F3")
          im.save(root/"assets/og-card.png",optimize=True)

          notes=root/"RELEASE-NOTES.txt"
          old=notes.read_text(encoding="utf-8",errors="ignore") if notes.exists() else ""
          head="""FillMyCourt v3.4 — Blue Identity Refresh — 24 Sep 2026
          - Replaced black/lime identity with deep-navy + blue/electric-blue system.
          - Added new horizontal FillMyCourt logo and favicon.
          - Reworked navigation, CTAs, dashboards, positive states and dark sections to the new visual system.
          - Updated Open Graph artwork to the new blue brand.
          - Preserved product copy, SEO architecture, forms, multilingual routes and conversion logic.

          """
          if not old.startswith("FillMyCourt v3.4"):
              notes.write_text(head+old,encoding="utf-8")
          PY

      - name: Commit v3.4 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Import FillMyCourt v3.4 blue identity source [skip import]'
          git push
