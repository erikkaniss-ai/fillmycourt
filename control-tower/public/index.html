<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Development Control Tower</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Read-only owner view</p>
          <h1>Development Control Tower</h1>
          <p class="subhead">Milestone acceptance, live source freshness and explicit decision gates — never commit-count theatre.</p>
        </div>
        <div id="freshness" class="freshness" aria-live="polite">Loading verified sources…</div>
      </header>
      <section id="rollup" class="rollup" aria-live="polite"></section>
      <section aria-labelledby="portfolio-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Portfolio</p>
            <h2 id="portfolio-title">Projects and decision gates</h2>
          </div>
          <p class="legend"><span class="dot verified"></span>actual verified <span class="dot synthetic"></span>synthetic verified <span class="dot manual"></span>manual <span class="dot unknown"></span>unverified</p>
        </div>
        <div id="projects" class="project-grid"></div>
      </section>
    </main>
    <template id="project-template">
      <article class="project-card">
        <div class="card-heading">
          <div>
            <p class="portfolio"></p>
            <h3></h3>
          </div>
          <span class="access"></span>
        </div>
        <div class="progress-row">
          <div class="progress-track"><div class="progress-value"></div></div>
          <strong class="progress-label"></strong>
        </div>
        <p class="progress-note"></p>
        <details class="details source-details"><summary class="source-summary">PR / CI evidence</summary><section class="live-source" aria-label="Live GitHub source"></section></details>
        <details class="details"><summary>Milestones and acceptance evidence</summary><ul class="milestones"></ul></details>
        <div class="lanes">
          <section><h4>Now</h4><ul class="now"></ul></section>
          <section><h4>Next</h4><ul class="next"></ul></section>
          <section><h4>Blocked</h4><ul class="blocked"></ul></section>
        </div>
        <details class="details"><summary>Environment and history</summary><div class="environments"></div><ol class="history"></ol></details>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
