name: Platform CI

on:
  push:
    branches: ["getacourt-staging"]
    paths:
      - "platform/**"
      - "getacourt/**"
      - "netlify/functions/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - "getacourt/**"
      - "netlify/functions/**"
      - ".github/workflows/platform-ci.yml"

# RC receives required PR CI only; staging integration pushes retain full CI.
# Cancel only obsolete revisions of the same PR; staging push runs remain.
concurrency:
  group: get-platform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast Get JS syntax and authorization boundaries
        run: |
          node --check getacourt/assets/app.js
          node --check getacourt/assets/auth-pkce.js
          node --check getacourt/assets/commercial-signals.js
          node --experimental-strip-types --test \
            platform/tests/getacourt_booking_source_guard.test.mjs \
            platform/tests/getacourt_date_contract.test.mjs \
            platform/tests/getacourt_geolocation_contract.test.mjs \
            platform/tests/getacourt_google_auth_contract.test.mjs \
            platform/tests/getacourt_auth_facade_contract.test.mjs \
            platform/tests/getacourt_session_contract.test.mjs \
            platform/tests/getacourt_session_isolation.test.mjs \
            platform/tests/getacourt_netlify_contract.test.mjs \
            platform/tests/getacourt_map_csp_contract.test.mjs \
            platform/tests/getacourt_install_contract.test.mjs \
            platform/tests/getacourt_commercial_signals_contract.test.mjs \
            platform/tests/getacourt_ci_dispatch_contract.test.mjs
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fmc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fmc_test
      PSQL_URL: postgresql://postgres:postgres@localhost:5432/fmc_test
      PYTHONPATH: \${{ github.workspace }}/platform/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r platform/requirements-dev.txt
      - name: Compile
        run: python -m compileall -q platform/src
      - name: Verify GetAcourt CI dispatch and full-suite retention contracts
        run: node --test platform/tests/getacourt_ci_dispatch_contract.test.mjs
      - name: Verify GetAcourt browser JS syntax
        run: node --check getacourt/assets/app.js && node --check getacourt/assets/commercial-signals.js
      - name: Decision 104 GetAcourt commercial observability shadow contracts
        run: node --test platform/tests/getacourt_commercial_signals_contract.test.mjs
      - name: GetACourt native-only booking source guard contracts
        run: node --test platform/tests/getacourt_booking_source_guard.test.mjs
      - name: Install isolated QA-08 browser runner (no deploy)
        run: npm install --prefix platform/tests/browser --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 leaflet@1.9.4
      - name: GetAcourt QA-08 real Chromium local fixture E2E (no external requests or writes)
        run: node --test platform/tests/browser/getacourt_browser_e2e.mjs
      - name: QA-09 actual upstream Leaflet/SRI local Chromium E2E (no external writes)
        run: node --test platform/tests/browser/getacourt_real_leaflet_e2e.mjs
      - name: GetAcourt UI date contract tests
        run: node --test platform/tests/getacourt_date_contract.test.mjs
      - name: GetAcourt location permission + near-me contract tests
        run: node --test platform/tests/getacourt_geolocation_contract.test.mjs
      - name: GetAcourt Leaflet map CSP and resource integrity contracts
        run: node --test platform/tests/getacourt_map_csp_contract.test.mjs
      - name: GetAcourt PWA installability contract tests
        run: node --test platform/tests/getacourt_install_contract.test.mjs
      - name: GetAcourt Google login PKCE + session contract tests
        run: node --test platform/tests/getacourt_google_auth_contract.test.mjs
      - name: GetAcourt auth gateway security contracts
        run: node --experimental-strip-types --test platform/tests/getacourt_auth_facade_contract.test.mjs
      - name: GetAcourt session race and revocation contracts
        run: node --test platform/tests/getacourt_session_contract.test.mjs
      - name: GetAcourt authenticated tabs and PWA privacy contracts
        run: node --test platform/tests/getacourt_session_isolation.test.mjs
      - name: GetAcourt Netlify facade contract tests (no network / no writes)
        run: node --experimental-strip-types --test platform/tests/getacourt_netlify_contract.test.mjs
      - name: Bootstrap Supabase auth contract
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users(id uuid primary key);
          create or replace function auth.uid()
          returns uuid language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
          SQL
      - name: Apply migrations from zero
        run: |
          for f in platform/supabase/migrations/*.sql; do
            echo "Applying $f"
            psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Test
        run: pytest -q platform/tests
      - name: QA-PREVIEW-02 anonymous Netlify perimeter (no auth, GET-only)
        if: github.event_name == 'pull_request' && github.base_ref == 'getacourt-staging'
        env:
          GAC_PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node platform/tests/getacourt_preview_perimeter_smoke.mjs

