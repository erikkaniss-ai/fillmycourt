name: GetACourt federated search
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [getacourt-staging]
    paths:
      - 'getacourt/**'
      - 'netlify/**'
      - '.github/workflows/getacourt-federated-search-ci.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact reviewed PR5 head SHA (40 lowercase hex); no branch fallback'
        required: true
        type: string
      scope:
        description: 'Explicit scope: pr5-reader-static'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && 'reader-approval' || 'get-federated' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  search-contract-and-browser:
    name: ${{ github.event.action == 'edited' && 'reader-approval-event-no-source-ci' || 'search-contract-and-browser' }}
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and actual search-handler contracts
        run: |
          node --check getacourt/assets/source-catalog.mjs
          node --check getacourt/assets/federated-search.mjs
          node --check getacourt/assets/federated-search-page.mjs
          node --check getacourt/assets/personal-observation-bridge.mjs
          node --check getacourt/browser-companion/reader.js
          node --test getacourt/tests/private-reader-preview.test.mjs
          node --test getacourt/tests/private-search-preview.test.mjs
          node --check getacourt/assets/court-search-page.mjs
          node --check getacourt/assets/event-discovery.mjs
          node --check getacourt/assets/event-demo-fixtures.mjs
          node --check getacourt/assets/event-discovery-view.mjs
          node --test getacourt/tests/event-*.test.mjs
          node --check getacourt/browser-companion/get-page-relay.js
          node --check getacourt/browser-companion/visible-provider-offers.js
          node --check getacourt/browser-companion/visible-provider-page.js
          node --test getacourt/tests/visible-provider-offers.test.mjs getacourt/tests/visible-provider-page.test.mjs getacourt/tests/multi-provider-player-flow.test.mjs
          node --check getacourt/browser-companion/playtomic-club-catalog.js
          node --test getacourt/tests/playtomic-multi-club.test.mjs
          node --test getacourt/tests/persistent-player-session.test.mjs
          node --experimental-strip-types --test getacourt/tests/club-availability.test.mjs
          node --experimental-strip-types --test getacourt/tests/federated-search.test.mjs getacourt/tests/personal-observation-bridge.test.mjs
      - name: Install pinned browser test dependencies
        run: |
          python -m pip install pytest==8.4.2 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Actual browser and handler with isolated fictional Core
        run: python -m pytest getacourt/tests/test_federated_browser.py getacourt/tests/test_court_search_browser.py getacourt/tests/test_private_event_bundle.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: getacourt-federated-FICTIONAL-CORE
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
  private-reader-draft:
    # Both paths still need the live exact-head owner gate before credentials.
    # Manual checkout must be the workflow's own assigned-branch immutable SHA.
    if: always() && !cancelled() && github.repository == 'erikkaniss-ai/fillmycourt' && ((github.event_name == 'pull_request' && github.event.pull_request.number == 5 && github.event.pull_request.head.ref == 'get/release-candidate-mvp-qa-04' && github.event.pull_request.head.repo.full_name == 'erikkaniss-ai/fillmycourt' && contains(github.event.pull_request.body, format('<!-- GET_STAGING_UAT_APPROVED_SHA:{0} -->', github.event.pull_request.head.sha)) && (((github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && needs['search-contract-and-browser'].result == 'success') || (github.event.action == 'edited' && needs['search-contract-and-browser'].result == 'skipped' && github.event.changes.body && github.actor == 'erikkaniss-ai' && github.triggering_actor == github.actor && github.event.sender.login == github.actor && github.event.sender.type == 'User' && github.run_attempt == 1))) || (github.event_name == 'workflow_dispatch' && needs['search-contract-and-browser'].result == 'skipped' && github.ref == 'refs/heads/get/release-candidate-mvp-qa-04' && inputs.scope == 'pr5-reader-static' && inputs.candidate_sha == github.sha))
    needs: search-contract-and-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.pull_request.head.sha }}
      READER_BROWSER_RESULT: ${{ needs.search-contract-and-browser.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require owner scope and complete CI before any deploy credential
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node getacourt/qa/private-reader-preview.mjs --gate
      - run: npm install --no-save --no-audit --no-fund netlify-cli@27.12.1
      - run: node getacourt/qa/private-reader-preview.mjs --prepare
      - name: Recheck reviewed PR head and approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node getacourt/qa/private-reader-preview.mjs --gate
      - name: Upload static DRAFT to the existing protected Get site only
        working-directory: ${{ runner.temp }}/get-reader-static
        env:
          # Reuse the existing team deploy credential only inside Actions. It is
          # never retrieved by the agent, placed in assets or exposed to browser.
          NETLIFY_AUTH_TOKEN: ${{ secrets.FILL_NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'Existing team deploy credential unavailable'; exit 1; }
          "$GITHUB_WORKSPACE/node_modules/.bin/netlify" deploy \
            --site 5dbcc4a3-5c87-4c75-959f-9a4f9fbc9570 \
            --dir . --functions functions --alias get-pr5-reader-uat --no-build --json \
            > "$RUNNER_TEMP/get-reader-static-result.json"
      - name: Verify new draft requires Team Login
        run: node getacourt/qa/private-reader-preview.mjs --verify
  private-search-draft:
    if: github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.pull_request.number == 5 && contains(github.event.pull_request.body, format('<!-- GET_SEARCH_UAT_APPROVED_SHA:{0} -->', github.event.pull_request.head.sha))
    needs: search-contract-and-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require exact search scope, complete CI and existing Team Login
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node getacourt/qa/private-search-preview.mjs --gate
      - run: npm install --no-save --no-audit --no-fund netlify-cli@27.12.1
      - run: node getacourt/qa/private-search-preview.mjs --prepare
      - name: Recheck reviewed source and scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node getacourt/qa/private-search-preview.mjs --gate
      - name: Upload protected DRAFT with only one read-only search function
        working-directory: ${{ runner.temp }}/get-search-direct
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.FILL_NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'Existing team deploy credential unavailable'; exit 1; }
          "$GITHUB_WORKSPACE/node_modules/.bin/netlify" deploy --site 5dbcc4a3-5c87-4c75-959f-9a4f9fbc9570 --dir getacourt --functions netlify/functions --alias get-pr5-search-uat --no-build --json > "$RUNNER_TEMP/get-search-result.json"
      - name: Verify protected page and API
        run: node getacourt/qa/private-search-preview.mjs --verify
